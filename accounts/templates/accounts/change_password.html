{% extends "base.html" %}

{% block title %}비밀번호 변경 · Thread{% endblock title %}

{% block content %}
  <section class="form-panel">
    <h1 class="h2 fw-bold">비밀번호 변경</h1>
    <p class="text-body-secondary mb-4">현재 비밀번호를 확인하고 새 비밀번호를 입력해 주세요.</p>

    <form class="card card-body p-4 shadow-sm" method="POST">
      {% csrf_token %}
      {% include "accounts/_fields.html" %}
      <div class="d-flex flex-wrap gap-2 mt-3">
        <button class="btn btn-primary" type="submit">비밀번호 변경</button>
        <a class="btn btn-outline-secondary" href="{% url 'accounts:update' %}">회원정보로 돌아가기</a>
      </div>
    </form>

    <p class="small text-body-secondary mt-3">비밀번호를 변경한 후에도 로그인 상태가 유지됩니다.</p>
  </section>
{% endblock content %}
