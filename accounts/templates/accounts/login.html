{% extends "base.html" %}

{% block title %}로그인 · Thread{% endblock title %}

{% block content %}
  <section class="form-panel">
    <h1 class="h2 fw-bold">로그인</h1>
    <p class="text-body-secondary mb-4">로그인하고 좋아하는 책을 함께 나눠 보세요.</p>

    <form class="card card-body p-4 shadow-sm" method="POST">
      {% csrf_token %}
      {% include "accounts/_fields.html" %}
      <div class="d-flex flex-wrap gap-2 mt-3">
        <button class="btn btn-primary" type="submit">로그인</button>
        <a class="btn btn-outline-secondary" href="{% url 'books:index' %}">목록으로</a>
      </div>
    </form>

    <p class="small text-body-secondary mt-3">아직 계정이 없나요? <a href="{% url 'accounts:signup' %}">회원가입</a></p>
  </section>
{% endblock content %}
